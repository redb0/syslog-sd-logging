name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.10"

      - name: Sync lint dependencies
        run: uv sync --group lint --frozen

      - name: Ruff check
        run: uv run ruff check syslog_sd_logging tests

      - name: Ruff format (check only)
        run: uv run ruff format --check syslog_sd_logging tests

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v8
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync test dependencies
        run: uv sync --group test --frozen

      - name: Run tests with coverage
        run: uv run pytest

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: py-${{ matrix.python-version }}
          fail_ci_if_error: false
